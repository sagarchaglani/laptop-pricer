name: collect

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: daily-collection
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python collector.py && python clean.py && python model.py
        env:
          EBAY_ID: ${{ secrets.EBAY_ID }}
          EBAY_SECRET: ${{ secrets.EBAY_SECRET }}
      - name: Save updated database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.db
          if git diff --cached --quiet; then
            echo "Database did not change."
          else
            git commit -m "Update daily listing snapshot"
            git push
          fi
